<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Website | Contact</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <nav class="navbar">
      <a class="logo" href="index.html">My Website</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <h1>Contact Us</h1>
      <p>Send us a message or reach out using the details below.</p>
    </section>

    <section class="section contact-layout">
      <div class="contact-info">
        <h2>Get in Touch</h2>
        <p><strong>Email:</strong> hello@example.com</p>
        <p><strong>Phone:</strong> +1 234 567 8900</p>
        <p><strong>Location:</strong> Your City, Your Country</p>
      </div>

      <form class="contact-form">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Your email" />

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" placeholder="Your message"></textarea>

        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 My Website. All rights reserved.</p>
  </footer>
</body>
</html>
